# Netlify 배포 설정 파일
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify에서 사용할 Node.js 버전 (LTS)
  NODE_VERSION = "22"

# 주소창에서 새로고침해도 404가 나지 않도록 모든 주소를 index.html로 연결
# (public/files/ 안의 실제 파일은 이 규칙보다 먼저 그대로 제공됩니다)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
